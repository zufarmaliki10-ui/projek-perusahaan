<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - MyOffice</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- Bootstrap Icon -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Average+Sans&family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />

    <!-- Local Style -->
    <link rel="stylesheet" href="style/style.css" />
  </head>
  <body>
    <!-- Navbar Section -->
    <nav class="navbar navbar-expand-lg">
      <div class="container-fluid">
        <a class="navbar-brand fw-bold fs-3 text-warning" href="#">MyOffice</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="index.html"
                >Dashboard</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#"
                >Absensi</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="cuti.html"
                >Cuti</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="gaji.html"
                >Gaji</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <!-- Navbar Section -->
    <!-- Main Content -->
    <section class="main">
      <div class="card my-4 w-75 mx-auto p-4">
          <h2 class="text-center">Absensi Karyawan</h2>
          <h5 class="text-center" id="tanggal">Jam</h5>
          <h3 class="text-center" id="jam">Jam</h3>
        <select class="my-3 w-50 mx-auto form-select" name="" id="">
            <option value="">Hadir</option>
            <option value="">Izin</option>
            <option value="">Sakit</option>
        </select>
        <div class="text-center my-2">
          <p class="clock-in m-0 text-danger">Harap absen masuk sebelum jam 08.00</p>
          <p class="clock-out m-0 text-danger">Absen keluar pada pukul 17.00</p>
        </div>
        <div class="d-flex justify-content-center gap-3">
            <button class="btn btn-primary btn-sm">Masuk</button>
            <button class="btn btn-primary btn-sm">Pulang</button>
        </div>
      </div>
    </section>
    <!-- Main Content -->
    <!-- Footer Section -->
    <footer
      class="p-3 text-light fw-bold align-content-center"
    >
    <p class="m-0 align-content-center text-center">
      MyOffice Designed by
      <a class="text-decoration-none text-warning" href="">OmahCreative</a>
    </p>
    <p class="m-0 align-content-center text-center">&copy 2026</p>
    </footer>
    <!-- Footer Section -->
    <!-- Chart JS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Local Js -->
    <script src="js/script.js"></script>

    <!-- Bootstrap -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
