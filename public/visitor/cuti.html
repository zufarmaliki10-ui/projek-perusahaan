  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    />

    <!-- Bootstrap Icon -->
    <link
      rel="stylesheet"

    />

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Average+Sans&family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />

    <!-- Local Style -->
    <link rel="stylesheet" href="style/style.css" />

  <body>
    <!-- Navbar Section -->
    <nav class="navbar navbar-expand-lg">
      <div class="container-fluid">
        <a class="navbar-brand fw-bold fs-3 text-warning" href="#">MyOffice</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="index.html"
                >Dashboard</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="absen.html"
                >Absensi</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#">Cuti</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="gaji.html"
                >Gaji</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <!-- Navbar Section -->
    <!-- Main Content -->
    <section class="main">
      <div class="card p-2 col-md-6 mx-auto my-3">
        <h4>Form Pengajuan Cuti Karyawan</h4>
        <form class="" action="">
          <label class="form-label" for="nama">Nama</label>
          <input
            class="form-control"
            type="text"
            id="nama"
            placeholder="Nama Lengkap Karyawan"
          />
          <div class="d-flex justify-content-between">
            <div class="form-tgl my-2">
              <label class="form-label" for="">Mulai Cuti</label>
              <input class="form-control" type="date" />
            </div>
            <div class="form-tgl my-2">
              <label class="form-label" for="">Akhir Cuti</label>
              <input class="form-control" type="date" />
            </div>
          </div>
          <label class="form-label" for="">Rincian Cuti</label>
          <textarea
            class="form-control"
            name=""
            id=""
            placeholder="masukkan rincian cuti anda.."
          ></textarea>
          <a class="btn btn-primary d-block w-50 mx-auto my-3" href=""
            >Kirim Pengajuan Cuti</a
          >
        </form>
      </div>
    </section>
    <!-- Main Content -->
    <!-- Footer Section -->
    <footer class="p-3 text-light fw-bold align-content-center">
      <p class="m-0 align-content-center text-center">
        MyOffice Designed by
        <a class="text-decoration-none text-warning" href="">OmahCreative</a>
      </p>
      <p class="m-0 align-content-center text-center">&copy 2026</p>
    </footer>
    <!-- Footer Section -->
    <!-- Chart JS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Local Js -->
    <script src="js/script.js"></script>

    <!-- Bootstrap -->

      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
