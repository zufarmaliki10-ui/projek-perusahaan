<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - MyOffice</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- Bootstrap Icon -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Average+Sans&family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />

    <!-- Local Style -->
    <link rel="stylesheet" href="style/style.css" />
  </head>
  <body>
    <div class="d-flex">
      <!-- Sidebar -->
      <aside id="sidebar">
        <!-- Toggle Btn -->
        <div class="sidebar-toggle d-flex justify-content-center py-1">
          <button
            class="toggler-btn bi bi-list fs-5 text-warning"
            type="button"
            style="height: 30px"
          ></button>
        </div>
        <!-- Toggle Btn -->
        <!-- Sidebar Logo -->
        <div class="sidebar-logo">
          <h3 class="my-3 text-warning fs-3 text-center">MyOffice</h3>
        </div>
        <!-- Sidebar Logo -->
        <!-- Sidebar Navigation -->
        <ul class="sidebar-nav">
          <li class="sidebar-item">
            <a class="sidebar-link" href="index.html">
              <i class="bi bi-speedometer2"></i>
              <span>Dashboard</span>
            </a>
          </li>
          <li class="sidebar-item">
            <a class="sidebar-link" href="karyawan.html">
              <i class="bi bi-people-fill"></i>
              <span>Karyawan</span>
            </a>
          </li>
          <li class="sidebar-item">
            <a class="sidebar-link" href="departemen.html">
              <i class="bi bi-building-fill"></i>
              <span>Departemen</span>
            </a>
          </li>
          <li class="sidebar-item">
            <a class="sidebar-link" href="absensi.html">
              <i class="bi bi-calendar-check-fill"></i>
              <span>Absensi</span>
            </a>
          </li>
          <li class="sidebar-item">
            <a class="sidebar-link" href="validasi_cuti.html">
              <i class="bi bi-file-earmark-text-fill"></i>
              <span>Cuti</span>
            </a>
          </li>
          <li class="sidebar-item">
            <a class="sidebar-link" href="admin_gaji.html">
              <i class="bi bi-cash-stack"></i>
              <span>Gaji</span>
            </a>
          </li>
        </ul>
        <!-- Sidebar Navigation -->
      </aside>
      <!-- Sidebar -->
      <!-- Main Content -->
      <div class="main">
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg">
          <div class="container-fluid">
            <div class="search d-flex justify-content-between col-md-5">
              <div class="input-group my-2 mx-2 w-100">
                <input
                  type="text"
                  class="form-control"
                  placeholder="Search"
                  aria-label="Search"
                  aria-describedby="basic-addon1"
                />
                <span
                  class="btn btn-secondary align-content-center"
                  id="basic-addon1"
                  ><i class="bi bi-search"></i
                ></span>
              </div>
            </div>
            <div class="profil d-flex col-md-2 justify-content-evenly">
              <button class="toggler-btn" type="button">
                <i class="bi bi-bell"></i>
              </button>
              <div class="align-content-center text-dark">
                <h6 class="m-0">
                  <strong>Nama HRD</strong>
                </h6>
                <p class="m-0">as HRD</p>
              </div>
            </div>
          </div>
        </nav>
        <!-- Navbar -->
        <!-- Main Content -->
        <div>
          <!-- Data Karyawan -->
          <div class="row mx-2 my-4">
            <div class="col-md-12 my-sm-1 px-sm-1 col-xl-12 my-xl-0 px-xl-3">
              <h5>Data Karyawan</h5>
              <select class="form-select my-3 w-50" aria-label="Default select example">
                <option selected>-- Pilih Departemen --</option>
                <option value="1">One</option>
                <option value="2">Two</option>
                <option value="3">Three</option>
              </select>
              <div class="table-responsive">
                <table class="table table-striped table-hover">
                  <thead>
                    <tr>
                      <th>No</th>
                      <th>Nama Lengkap</th>
                      <th>Departemen</th>
                      <th>Jabatan</th>
                      <th>Tanggal Masuk</th>
                      <th>Status</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td>1</td>
                      <td>Heru</td>
                      <td>Media & Publikasi</td>
                      <td>Anggota</td>
                      <td>13 Oktober 2025</td>
                      <td>
                        <span class="badge text-bg-success">Aktif</span>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
          <!-- Data Perusahaan -->
        </div>
        <!-- Main Content -->
        <!-- Footer Section -->
        <footer class="p-3 text-dark fw-bold align-content-center">
          <p class="m-0 align-content-center text-center">
            MyOffice Designed by
            <a class="text-decoration-none text-primary" href=""
              >OmahCreative</a
            >
          </p>
          <p class="m-0 align-content-center text-center">&copy 2026</p>
        </footer>
        <!-- Footer Section -->
      </div>
      <!-- Main Content -->
    </div>

    <!-- Chart JS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Local Js -->
    <script src="js/script.js"></script>

    <!-- Bootstrap -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
